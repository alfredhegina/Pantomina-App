# Pantomina — XcodeGen
name: Pantomina
options:
  bundleIdPrefix: pantomina.heginaholdings
  deploymentTarget:
    iOS: "17.6"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 1 = iPhone only (compatibility mode on iPad). Never "1,2".
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.6"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
configs:
  Preprod: debug
  Prod: release
schemes:
  Pantomina-Preprod:
    build:
      targets:
        Pantomina: all
    run:
      config: Preprod
    test:
      config: Preprod
      targets:
        - PantominaTests
  Pantomina-Prod:
    build:
      targets:
        Pantomina: all
    run:
      config: Prod
targets:
  Pantomina:
    type: application
    platform: iOS
    sources:
      - path: Pantomina
    settings:
      base:
        PRODUCT_NAME: Pantomina
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pantomina
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Preprod:
          PRODUCT_BUNDLE_IDENTIFIER: pantomina.heginaholdings.com.preprod
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PREPROD DEBUG
          INFOPLIST_KEY_CFBundleDisplayName: Pantomina Beta
          TARGETED_DEVICE_FAMILY: "1"
        Prod:
          PRODUCT_BUNDLE_IDENTIFIER: pantomina.heginaholdings.com
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          INFOPLIST_KEY_CFBundleDisplayName: Pantomina
          TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Pantomina/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIDeviceFamily:
          - 1
  PantominaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PantominaTests
    dependencies:
      - target: Pantomina
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pantomina.heginaholdings.com.tests
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Preprod:
          TARGETED_DEVICE_FAMILY: "1"
        Prod:
          TARGETED_DEVICE_FAMILY: "1"
